```html
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassenbrett</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#687386;
  --line:#e5e9f0;
  --accent:#4f46e5;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(23,32,51,.08)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

button,
input,
textarea,
select{
  font:inherit
}

button{
  cursor:pointer
}

header{
  background:linear-gradient(135deg,#111827,#3730a3);
  color:white;
  padding:28px 18px 44px
}

.top{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  background:#fff;
  color:#3730a3;
  display:grid;
  place-items:center;
  font-size:23px
}

.brand h1{
  font-size:22px;
  margin:0
}

.brand small{
  opacity:.75
}

.container{
  max-width:1050px;
  margin:-22px auto 40px;
  padding:0 16px
}

.toolbar{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.search{
  flex:1;
  min-width:200px
}

.input,
.textarea,
.select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px 12px;
  background:#fff;
  outline:none
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px #eef2ff
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  background:#eef2ff;
  color:#3730a3;
  font-weight:650
}

.btn.primary{
  background:var(--accent);
  color:#fff
}

.btn.danger{
  background:#fee2e2;
  color:#991b1b
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:14px 2px
}

.chip{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 13px
}

.chip.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:16px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
  box-shadow:0 5px 18px rgba(23,32,51,.05)
}

.card.pinned{
  border-color:#c7d2fe;
  box-shadow:0 8px 25px rgba(79,70,229,.1)
}

.meta{
  color:var(--muted);
  font-size:13px
}

.tag{
  display:inline-block;
  background:#f1f5f9;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  margin-bottom:9px
}

.card h3{
  margin:4px 0 7px;
  font-size:18px
}

.card p{
  margin:0 0 12px;
  white-space:pre-wrap
}

.attachment{
  display:block;
  padding:9px 10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  margin:8px 0;
  color:#334155;
  text-decoration:none;
  overflow:hidden;
  text-overflow:ellipsis
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px
}

.comments{
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:12px
}

.comment{
  font-size:13px;
  margin:8px 0
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
  grid-column:1/-1
}

.modal-back{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:5
}

.modal-back.show{
  display:flex
}

.modal{
  background:#fff;
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:21px;
  box-shadow:0 25px 70px rgba(0,0,0,.25)
}

.modal h2{
  margin-top:0
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-weight:650;
  margin-bottom:6px
}

.hint{
  font-size:12px;
  color:var(--muted);
  margin-top:5px
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:30px
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr
  }

  .top{
    align-items:flex-start
  }

  .brand h1{
    font-size:19px
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="brand">

      <div class="logo">
        📌
      </div>

      <div>

        <h1>Klassenbrett</h1>

        <small>
          Das digitale schwarze Brett eurer Klasse
        </small>

      </div>

    </div>

    <button
      class="btn"
      onclick="openClassCode()">

      🔐 Klassen-Code

    </button>

  </div>

</header>


<main class="container">

  <section class="toolbar">

    <input
      id="search"
      class="input search"
      placeholder="🔎 Beiträge durchsuchen..."
      oninput="render()">

    <button
      class="btn primary"
      onclick="openPost()">

      ＋ Beitrag erstellen

    </button>

  </section>


  <div id="filters" class="filters"></div>


  <section
    id="posts"
    class="grid">
  </section>


  <div class="footer">

    Klassenbrett • Daten werden in diesem Browser gespeichert.

  </div>

</main>


<div
  id="modalBack"
  class="modal-back"
  onclick="if(event.target===this)closeModal()">

  <div
    class="modal"
    id="modal">
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  
  const SUPABASE_URL = "https://mlmjvmywrpkhymbwcnan.supabase.co";
const SUPABASE_KEY = "sb_publishable_oB3uq-6vK3BTbtne8Wje5Q_-yajO4iU";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const KEY="klassenbrett-v1";


let state=JSON.parse(
  localStorage.getItem(KEY)||"null"
)||{

  code:"KLASSE2026",

  name:"Meine Klasse",

  author:"",

  filter:"Alle",

  posts:[

    {
      id:1,

      title:"Willkommen auf dem Klassenbrett! 🎉",

      text:"Hier könnt ihr wichtige Infos, Fragen, gefundene Sachen und vieles mehr teilen.",

      cat:"Ankündigung",

      author:"Klassenvertretung",

      date:new Date().toISOString(),

      pinned:true,

      comments:[]
    },

    {
      id:2,

      title:"Hat jemand meine Mathe-Notizen?",

      text:"Ich glaube, ich habe mein Heft heute im Klassenraum liegen lassen. Falls es jemand gesehen hat, gerne hier kommentieren.",

      cat:"Suche",

      author:"Beispiel",

      date:new Date(Date.now()-86400000).toISOString(),

      pinned:false,

      comments:[]
    }

  ]

};


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}


const cats=[
  "Alle",
  "Ankündigung",
  "Suche",
  "Biete",
  "Schule",
  "Lernen",
  "Sonstiges"
];


function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,

    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function fmt(d){

  return new Date(d).toLocaleString(
    "de-DE",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function renderFilters(){

  document.getElementById("filters").innerHTML=

    cats.map(c=>`

      <button
        class="chip ${state.filter===c?"active":""}"
        onclick="state.filter='${c}';save();render()">

        ${c}

      </button>

    `).join("");

}


function render(){

  renderFilters();

  const q=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let posts=

    state.posts.filter(

      p=>
        (state.filter==="Alle"||p.cat===state.filter)
        &&
        (
          !q
          ||
          (
            p.title+
            " "+
            p.text+
            " "+
            p.author+
            " "+
            p.cat
          )
          .toLowerCase()
          .includes(q)
        )

    );


  posts.sort(

    (a,b)=>
      (b.pinned-a.pinned)
      ||
      new Date(b.date)-new Date(a.date)

  );


  const box=
    document.getElementById("posts");


  if(!posts.length){

    box.innerHTML=`

      <div class="empty">

        📭<br>

        <strong>
          Keine Beiträge gefunden.
        </strong>

        <br>

        Erstelle einfach den ersten Beitrag.

      </div>

    `;

    return;

  }


  box.innerHTML=

    posts.map(p=>`

      <article
        class="card ${p.pinned?"pinned":""}">

        <div class="tag">

          ${
            p.pinned
            ?"📌 Angepinnt · "
            :""
          }

          ${esc(p.cat)}

        </div>


        <h3>
          ${esc(p.title)}
        </h3>


        <p>
          ${esc(p.text)}
        </p>


        ${
          p.file
          ?
          `
          <a
            class="attachment"
            href="${p.file.url}"
            download="${esc(p.file.name)}">

            📎 ${esc(p.file.name)}

          </a>
          `
          :""
        }


        <div class="meta">

          👤 ${esc(p.author||"Anonym")}

          ·

          ${fmt(p.date)}

        </div>


        <div class="actions">

          <button
            class="btn"
            onclick="toggleComments(${p.id})">

            💬 ${p.comments.length}

          </button>


          ${
            p.pinned
            ?
            `
            <button
              class="btn"
              onclick="togglePin(${p.id})">

              📍 Lösen

            </button>
            `
            :
            `
            <button
              class="btn"
              onclick="togglePin(${p.id})">

              📌 Anpinnen

            </button>
            `
          }


          <button
            class="btn danger"
            onclick="deletePost(${p.id})">

            Löschen

          </button>

        </div>


        <div
          id="comments-${p.id}"
          class="comments"
          style="display:none">

          ${
            p.comments.map(c=>`

              <div class="comment">

                <strong>
                  ${esc(c.author)}
                </strong>:

                ${esc(c.text)}

                <div class="meta">

                  ${fmt(c.date)}

                </div>

              </div>

            `).join("")
            ||
            '<div class="meta">Noch keine Kommentare.</div>'
          }


          <div
            style="display:flex;gap:7px;margin-top:10px">

            <input
              id="ci-${p.id}"
              class="input"
              placeholder="Kommentar schreiben..."
              onkeydown="if(event.key==='Enter')addComment(${p.id})">


            <button
              class="btn primary"
              onclick="addComment(${p.id})">

              Senden

            </button>

          </div>

        </div>

      </article>

    `).join("");

}


function openPost(){

  showModal(`

    <h2>
      Neuen Beitrag erstellen
    </h2>


    <div class="field">

      <label>
        Titel
      </label>

      <input
        id="pt"
        class="input"
        maxlength="80"
        placeholder="z. B. Klassenfahrt – wichtige Info">

    </div>


    <div class="field">

      <label>
        Text
      </label>

      <textarea
        id="px"
        class="textarea"
        rows="6"
        maxlength="2000"
        placeholder="Was möchtest du mitteilen?"></textarea>

    </div>


    <div class="row">

      <div class="field">

        <label>
          Kategorie
        </label>

        <select
          id="pc"
          class="select">

          ${
            cats
              .slice(1)
              .map(c=>`<option>${c}</option>`)
              .join("")
          }

        </select>

      </div>


      <div class="field">

        <label>
          Dein Name
        </label>

        <input
          id="pa"
          class="input"
          maxlength="40"
          placeholder="z. B. Leon">

      </div>

    </div>


    <div class="field">

      <label>
        Anhang
        <span class="meta">
          (optional)
        </span>
      </label>

      <input
        id="pf"
        class="input"
        type="file"
        accept="image/*,.pdf,.txt,.doc,.docx">

    </div>


    <div class="actions">

      <button
        class="btn"
        onclick="closeModal()">

        Abbrechen

      </button>


      <button
        class="btn primary"
        onclick="createPost()">

        Veröffentlichen

      </button>

    </div>

  `);

}


function createPost(){

  const title=
    document
      .getElementById("pt")
      .value
      .trim();


  const text=
    document
      .getElementById("px")
      .value
      .trim();


  const author=
    document
      .getElementById("pa")
      .value
      .trim()
      ||
      "Anonym";


  const cat=
    document
      .getElementById("pc")
      .value;


  const file=
    document
      .getElementById("pf")
      .files[0];


  if(!title||!text){

    alert(
      "Bitte Titel und Text ausfüllen."
    );

    return;

  }


  if(file&&file.size>1500000){

    alert(
      "Der Anhang ist zu groß. Bitte maximal 1,5 MB verwenden."
    );

    return;

  }


  const finish=(f)=>{

    state.posts.push({

      id:Date.now(),

      title,

      text,

      author,

      cat,

      date:new Date().toISOString(),

      pinned:false,

      comments:[],

      file:f

    });


    save();

    closeModal();

    render();

  };


  if(file){

    const r=new FileReader();

    r.onload=()=>

      finish({
        name:file.name,
        url:r.result
      });

    r.readAsDataURL(file);

  }

  else{

    finish(null);

  }

}


function togglePin(id){

  const p=
    state.posts.find(
      x=>x.id===id
    );


  p.pinned=!p.pinned;

  save();

  render();

}


function deletePost(id){

  if(
    confirm(
      "Diesen Beitrag wirklich löschen?"
    )
  ){

    state.posts=
      state.posts.filter(
        p=>p.id!==id
      );

    save();

    render();

  }

}


function toggleComments(id){

  const e=
    document.getElementById(
      "comments-"+id
    );


  e.style.display=
    e.style.display==="none"
    ?"block"
    :"none";

}


function addComment(id){

  const i=
    document.getElementById(
      "ci-"+id
    );


  const t=
    i.value.trim();


  if(!t)return;


  const p=
    state.posts.find(
      x=>x.id===id
    );


  p.comments.push({

    text:t,

    author:
      state.author||"Anonym",

    date:
      new Date().toISOString()

  });


  save();

  render();


  setTimeout(()=>{

    document.getElementById(
      "comments-"+id
    ).style.display="block";

  },0);

}


function openClassCode(){

  showModal(`

    <h2>
      🔐 Klassen-Einstellungen
    </h2>


    <div class="field">

      <label>
        Name der Klasse
      </label>

      <input
        id="cn"
        class="input"
        value="${esc(state.name)}">

    </div>


    <div class="field">

      <label>
        Klassen-Code
      </label>

      <input
        id="cc"
        class="input"
        value="${esc(state.code)}">


      <div class="hint">

        In dieser Demo dient der Code als
        gemeinsamer Zugangscode.

        Für einen echten öffentlichen Einsatz
        sollte eine Server-Anmeldung ergänzt werden.

      </div>

    </div>


    <div class="field">

      <label>
        Dein Name
      </label>

      <input
        id="ca"
        class="input"
        value="${esc(state.author)}"
        placeholder="Optional">

    </div>


    <div class="actions">

      <button
        class="btn"
        onclick="closeModal()">

        Abbrechen

      </button>


      <button
        class="btn primary"
        onclick="saveSettings()">

        Speichern

      </button>

    </div>

  `);

}


function saveSettings(){

  state.name=
    document
      .getElementById("cn")
      .value
      .trim()
    ||
    "Meine Klasse";


  state.code=
    document
      .getElementById("cc")
      .value
      .trim()
    ||
    "KLASSE2026";


  state.author=
    document
      .getElementById("ca")
      .value
      .trim();


  save();

  closeModal();

}


function showModal(html){

  document
    .getElementById("modal")
    .innerHTML=html;


  document
    .getElementById("modalBack")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("modalBack")
    .classList.remove("show");

}


render();
  supabaseClient
  .from("posts")
  .select("*")
  .then(({ data, error }) => {
    if (error) {
      console.error("Supabase Fehler:", error);
    } else {
      console.log("Supabase Verbindung funktioniert!", data);
    }
  });

</script>

</body>
</html>
```
